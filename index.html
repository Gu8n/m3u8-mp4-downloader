<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M3U8 a MP4 HD</title><style>body{font-family:Arial,sans-serif;background:#10141c;color:#fff;max-width:680px;margin:40px auto;padding:20px}main{background:#1c2430;padding:24px;border-radius:16px}input,button{box-sizing:border-box;width:100%;padding:14px;margin:10px 0;border-radius:10px;border:0;font-size:16px}button{background:#f0b429;color:#111;font-weight:bold}small{color:#bac4d2}#status{white-space:pre-wrap}</style><main><h1>M3U8 → MP4 HD</h1><p>Pega un enlace de manifiesto M3U8 para intentar convertirlo a MP4.</p><input id="url" type="url" placeholder="https://.../playlist.m3u8"><button id="go">Descargar MP4</button><p id="status"></p><small>Solo enlaces a los que tengas permiso de acceso. No admite streams protegidos con DRM.</small></main><script>const b=document.getElementById('go'),s=document.getElementById('status');b.onclick=async()=>{let u=document.getElementById('url').value.trim();if(!u){s.textContent='Pega primero el enlace M3U8.';return}b.disabled=true;s.textContent='Procesando…';try{let r=await fetch('/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u})});if(!r.ok){let d=await r.json();throw new Error(d.error||'Error')}let blob=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='video_hd.mp4';a.click();s.textContent='Descarga iniciada.'}catch(e){s.textContent='Error: '+e.message}finally{b.disabled=false}};</script></html>
